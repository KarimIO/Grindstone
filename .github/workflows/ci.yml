name: Build

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
            cmake-preset: WindowsRelease
            config: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Get CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'e6d62cc9ce8f8d9687df14521118f2ec3c10ee6a'
          runVcpkgInstall: false

      - name: Build with CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.cmake-preset }}
          buildPreset: ${{ matrix.cmake-preset }}

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/WindowsRelease `
            --config ${{ matrix.config }} `
            --prefix build/package/${{ matrix.os }}

      - name: Upload build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grindstone-${{ matrix.os }}-build
          path: build/package/${{ matrix.os }}/
          if-no-files-found: error

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

  unit-test:
    name: Windows Unit Tests
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.1
        with:
          name: grindstone-windows-latest-build
          path: build/package/windows-latest/

      - name: Run Common tests
        shell: pwsh
        run: |
          & ".\build\package\windows-latest\bin\Debug\Common.Test.exe"

